<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web Clone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- BARRA LATERAL (ESQUERDA) -->
        <div class="sidebar">
            <!-- HEADER DA SIDEBAR -->
            <div class="sidebar-header">
                <div class="header-title">
                    <h1>Chats</h1>
                </div>
                <div class="header-icons">
                    <button class="icon-btn" title="Nova conversa">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M5 12h14"></path>
                        </svg>
                    </button>
                    <button class="icon-btn" id="settings-btn" title="Configurações">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="1"></circle>
                            <circle cx="19" cy="12" r="1"></circle>
                            <circle cx="5" cy="12" r="1"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- BARRA DE PESQUISA -->
            <div class="search-container">
                <input 
                    type="text" 
                    class="search-input" 
                    placeholder="Pesquisar ou começar uma conversa"
                    id="search-input"
                >
            </div>

            <!-- LISTA DE CONVERSAS -->
            <div class="chat-list">
                <!-- Os chats serão inseridos aqui via JavaScript -->
            </div>
        </div>

        <!-- ÁREA PRINCIPAL (DIREITA) -->
        <div class="main-content">
            <!-- MENSAGEM DE BOAS-VINDAS (quando nenhum chat está aberto) -->
            <div class="welcome-container" id="welcome">
                <div class="welcome-content">
                    <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <h2>Selecione um chat para começar</h2>
                    <p>Escolha uma conversa na esquerda para abrir</p>
                </div>
            </div>

            <!-- ÁREA DE CONVERSA (fica escondida até selecionar um chat) -->
            <div class="chat-container" id="chat-container" style="display: none;">
                <!-- HEADER DA CONVERSA -->
                <div class="chat-header">
                    <div class="chat-header-info">
                        <h2 id="chat-name">Chat Name</h2>
                        <p id="chat-status">online</p>
                    </div>
                    <div class="chat-header-icons">
                        <button class="icon-btn" title="Chamada de áudio">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                            </svg>
                        </button>
                        <button class="icon-btn" title="Chamada de vídeo">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="23 7 16 12 23 17 23 7"></polygon>
                                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- ÁREA DE MENSAGENS -->
                <div class="messages-area" id="messages-area">
                    <!-- As mensagens serão inseridas aqui via JavaScript -->
                </div>

                <!-- ÁREA DE ENTRADA DE MENSAGEM -->
                <div class="message-input-area">
                    <button class="attachment-btn" title="Anexar arquivo">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 2.2"></path>
                        </svg>
                    </button>
                    <input 
                        type="text" 
                        class="message-input" 
                        id="message-input"
                        placeholder="Digite uma mensagem"
                    >
                    <button class="send-btn" id="send-btn" title="Enviar mensagem">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M16.6915026,12.4744748 L3.50612381,13.2599618 C3.19218622,13.2599618 3.03521743,13.4170592 3.03521743,13.5741566 L1.15159189,20.0151496 C0.8376543,20.8006365 0.99,21.89 1.77946707,22.52 C2.41,22.99 3.50612381,23.1 4.13399899,22.8429026 L21.714504,14.0454487 C22.6563168,13.5741566 23.1272231,12.6315722 22.9702544,11.6889879 L4.13399899,1.16134095 C3.34915502,0.9042436 2.40734225,1.01545254 1.77946707,1.4867446 C0.994623095,2.11821725 0.837654326,3.20760537 1.15159189,3.99309226 L3.03521743,10.4340853 C3.03521743,10.5911827 3.19218622,10.7482801 3.50612381,10.7482801 L16.6915026,11.5337671 C16.6915026,11.5337671 17.1624089,11.5337671 17.1624089,12.0050592 C17.1624089,12.4744748 16.6915026,12.4744748 16.6915026,12.4744748 Z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE CONFIGURAÇÕES -->
    <div class="settings-modal" id="settings-modal" style="display: none;">
        <div class="settings-content">
            <div class="settings-header">
                <h2>Configurações</h2>
                <button class="close-btn" id="close-settings">×</button>
            </div>

            <div class="settings-body">
                <!-- TEMA -->
                <div class="settings-section">
                    <h3>Tema</h3>
                    <div class="theme-options">
                        <label class="radio-label">
                            <input type="radio" name="theme" value="dark" checked>
                            <span>Escuro (Padrão)</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="theme" value="light">
                            <span>Claro</span>
                        </label>
                    </div>
                </div>

                <!-- COR PRIMÁRIA -->
                <div class="settings-section">
                    <h3>Cor Primária</h3>
                    <div class="color-options">
                        <label class="color-label">
                            <input type="radio" name="color" value="purple" checked>
                            <span class="color-box" style="background-color: #8b5cf6;"></span>
                            <span>Roxo</span>
                        </label>
                        <label class="color-label">
                            <input type="radio" name="color" value="green">
                            <span class="color-box" style="background-color: #10b981;"></span>
                            <span>Verde</span>
                        </label>
                        <label class="color-label">
                            <input type="radio" name="color" value="blue">
                            <span class="color-box" style="background-color: #3b82f6;"></span>
                            <span>Azul</span>
                        </label>
                        <label class="color-label">
                            <input type="radio" name="color" value="pink">
                            <span class="color-box" style="background-color: #ec4899;"></span>
                            <span>Rosa</span>
                        </label>
                    </div>
                </div>

                <!-- NOTIFICAÇÕES -->
                <div class="settings-section">
                    <h3>Notificações</h3>
                    <label class="toggle-label">
                        <input type="checkbox" id="notifications-toggle" checked>
                        <span>Ativar notificações de som</span>
                    </label>
                </div>

                <!-- PRIVACIDADE -->
                <div class="settings-section">
                    <h3>Privacidade</h3>
                    <label class="toggle-label">
                        <input type="checkbox" id="read-receipts-toggle" checked>
                        <span>Mostrar "visto"</span>
                    </label>
                </div>
            </div>

            <div class="settings-footer">
                <button class="btn-primary" id="save-settings">Salvar Configurações</button>
            </div>
        </div>
    </div>

    <!-- OVERLAY DO MODAL -->
    <div class="modal-overlay" id="modal-overlay" style="display: none;" onclick="closeSettings()"></div>

    <script src="script.js"></script>
</body>
</html>
